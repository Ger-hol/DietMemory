<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DietMemory</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#247a4b"><link rel="stylesheet" href="style.css"></head><body>
<div id="ekran-logowania" class="wrap"><header><h1>🥗 DietMemory</h1><p>Wspólna dieta Gerarda i Beaty</p></header><main><section><h2>Zaloguj się</h2><form id="formularz-logowania" class="grid"><label>E-mail<input id="login-email" type="email" autocomplete="email" required></label><label>Hasło<input id="login-haslo" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Zaloguj się</button></form><p id="login-komunikat"></p></section></main></div>
<div id="aplikacja-dietmemory" class="wrap hide"><header><div class="title"><div><h1>🥗 DietMemory</h1><p>Dieta Gerarda i Beaty</p></div><div><small>Zalogowano: <b id="zalogowany-email"></b></small><button id="przycisk-wyloguj">Wyloguj</button></div></div></header>
<main id="start"><section><h2>Menu główne</h2><div class="menu"><button data-go="dziennik">📖 Dziennik</button><button data-go="posilki">🍽️ Posiłki</button><button data-go="produkty">🥕 Produkty</button><button>📅 Plan diety</button><button>🛒 Lista zakupów</button><button>💰 Historia cen</button></div></section></main>
<main id="produkty" class="hide"><section><button class="back">← Start</button><h2>🥕 Produkty</h2><form id="productForm" class="grid"><label>Nazwa*<input id="pn" required></label><label>Producent<input id="pp"></label><label>EAN<input id="pe"></label><label>Porcja [g]<input id="po" type="number" step="any" min="0"></label><label>kcal / 100 g<input id="pk" type="number" step="any" min="0"></label><label>Białko / 100 g<input id="pb" type="number" step="any" min="0"></label><label>Tłuszcz / 100 g<input id="pt" type="number" step="any" min="0"></label><label>Węglowodany / 100 g<input id="pw" type="number" step="any" min="0"></label><button id="productSubmit" class="primary" type="submit">+ Dodaj produkt</button><button id="productCancelEdit" class="secondary hide" type="button">Anuluj edycję</button></form><p id="pmsg"></p></section><section><input id="psearch" placeholder="🔎 Szukaj produktu"><div id="plist"></div></section></main>
<main id="posilki" class="hide"><section><button class="back">← Start</button><div class="title"><h2>🍽️ Posiłki</h2><button id="newMeal" class="primary">+ Nowy przepis</button></div></section><section id="mealEditor" class="hide"><h2 id="mealEditorTitle">Nowy przepis</h2><div class="grid"><label>Nazwa*<input id="mn"></label><label>Liczba porcji<input id="mserv" type="number" min="0.01" step="any" value="1.00"></label><label>Czas przygotowania [min]<input id="mprep" type="number" min="0"></label><label>Czas gotowania [min]<input id="mcook" type="number" min="0"></label><label>Kategoria<select id="mcat"><option>Śniadanie</option><option>II Śniadanie</option><option>Obiad</option><option>Podwieczorek</option><option>Kolacja</option><option>Inne</option></select></label><label>Ocena<select id="mrating"><option value="0">Brak</option><option value="1">★☆☆☆☆</option><option value="2">★★☆☆☆</option><option value="3">★★★☆☆</option><option value="4">★★★★☆</option><option value="5">★★★★★</option></select></label><label>Masa gotowego dania [g]<input id="mweight" type="number" min="0" step="any"></label></div><h3>Składniki</h3><div class="ingredientAdd"><input id="isearch" placeholder="Wyszukaj produkt"><input id="iamount" type="number" min="0.1" step="any" placeholder="Ilość g"><button id="iadd">Dodaj</button><div id="isuggest"></div></div><div id="ingredients"></div><div id="mealTotals" class="totals"></div><label>Instrukcja<textarea id="minstr" rows="6"></textarea></label><div class="actions"><button id="cancelMeal">Anuluj</button><button id="saveMeal" class="primary">Zapisz przepis</button></div><p id="mmsg"></p></section><section><input id="msearch" placeholder="🔎 Szukaj posiłku"><div id="mealList"></div></section></main>
<main id="dziennik" class="hide"><section><button class="back">← Start</button><div class="title"><h2>📖 Dziennik</h2><div class="journalSettings"><select id="jperson"><option>Gerard</option><option>Beata</option></select><input id="jdate" type="date"></div></div></section><section class="summary"><b id="jk">0 kcal</b><b id="jb">B 0 g</b><b id="jt">T 0 g</b><b id="jw">W 0 g</b></section><div id="journalMeals"></div></main><footer>DietMemory</footer></div>
<div id="journalModal" class="modal hide"><div class="card"><button id="jclose" class="x">×</button><h2>Dodaj do <span id="jmealName"></span></h2><div class="tabs"><button id="tabProduct" class="active">🥕 Produkt</button><button id="tabMeal">🍽️ Posiłek</button></div><input id="jsearch" placeholder="Wyszukaj"><div id="jresults"></div><div id="jchosen" class="chosen hide"></div><label id="jamountLabel">Ilość [g]<input id="jamount" type="number" min="0.01" step="any"></label><div id="jpreview" class="totals"></div><button id="jadd" class="primary">Dodaj do dziennika</button><p id="jmsg"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></body></html>
